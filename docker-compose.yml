version: '3.8'

services:
  # MongoDB Database
  mongo:
    image: mongo:7.0
    container_name: drinkadvisor-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin123
      MONGO_INITDB_DATABASE: drinkadvisor
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - drinkadvisor-network

  # RabbitMQ Message Broker
  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: drinkadvisor-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: admin123
    ports:
      - "5672:5672"   # AMQP protocol
      - "15672:15672" # Management UI
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks:
      - drinkadvisor-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API (Node.js + Express)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: drinkadvisor-backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      PORT: 3000
      MONGO_URI: mongodb://admin:admin123@mongo:27017/drinkadvisor?authSource=admin
      JWT_SECRET: your-super-secret-jwt-key-change-in-production
      JWT_EXPIRE: 30d
      RABBITMQ_URL: amqp://admin:admin123@rabbitmq:5672
    volumes:
      - ./backend:/app
      - /app/node_modules
    networks:
      - drinkadvisor-network
    depends_on:
      rabbitmq:
        condition: service_healthy
      mongo:
        condition: service_started
    command: npm run dev

  # Frontend (React + Vite)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: drinkadvisor-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:5000/api
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - drinkadvisor-network
    depends_on:
      - backend
    command: npm run dev -- --host

volumes:
  mongo-data:
    driver: local
  rabbitmq-data:
    driver: local

networks:
  drinkadvisor-network:
    driver: bridge
